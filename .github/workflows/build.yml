
name: Build Rainbow Chronograph Watch Face

on:
  workflow_dispatch:
  push:
    paths:
      - "Modern_Rainbow_Gemstone_WearOS_Project_Icons_And_Larger_Readouts.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p build-source
          unzip -q Modern_Rainbow_Gemstone_WearOS_Project_Cleaned_Bottom_Bands.zip -d build-source

          PROJECT_DIR="$(find build-source -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle in extracted project."
            exit 1
          fi

          WATCHFACE_XML="$PROJECT_DIR/app/src/main/res/raw/watchface.xml"

          if [ ! -f "$WATCHFACE_XML" ]; then
            echo "Could not find watchface.xml."
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "WATCHFACE_XML=$GITHUB_WORKSPACE/$WATCHFACE_XML" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Get Watch Face Format validator
        run: |
          git clone --depth 1 https://github.com/google/watchface.git validator

          cd validator/third_party/wff

          chmod +x gradlew
          ./gradlew :specification:validator:executable-jar

          VALIDATOR_JAR="$GITHUB_WORKSPACE/validator/third_party/wff/specification/validator/build/libs/wff-validator.jar"

          if [ ! -f "$VALIDATOR_JAR" ]; then
            echo "Validator JAR was not created."
            exit 1
          fi

          echo "VALIDATOR_JAR=$VALIDATOR_JAR" >> "$GITHUB_ENV"

      - name: Validate Watch Face Format
        run: |
          java -jar "$VALIDATOR_JAR" 2 "$WATCHFACE_XML"

      - name: Build watch face APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rainbow-Gemstone-Watch-Face-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
